<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt hàng thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/static/css/styles.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="/">Start Bootstrap</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">Đặt hàng thành công!</h1>
            </div>
        </div>
    </header>

    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row justify-content-center">
                <div class="col-lg-6 text-center">
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle-fill" style="font-size:3rem"></i>
                        <h3 class="mt-3">Cảm ơn {{ customer_name }}!</h3>
                        <p>Bạn đã đặt <strong>{{ item.Name }}</strong> x{{ quantity }}</p>
                        <p>Tổng: <strong>{{ item.Price * quantity }} VND</strong></p>
                        <hr>
                        <p class="mb-0">Chúng tôi sẽ liên hệ bạn trong thời gian sớm nhất.</p>
                    </div>
                    <a href="/" class="btn btn-primary mt-3">Tiếp tục mua sắm</a>
                    <a href="/orders" class="btn btn-outline-secondary mt-3">Xem đơn hàng</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/scripts.js"></script>
</body>
</html>
