<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}Quản Lý Nhà Hàng{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/static/css/styles.css" rel="stylesheet" />
    <style>
        body { display: flex; min-height: 100vh; margin: 0; }
        .sidebar { width: 250px; background: linear-gradient(135deg, #212529, #343a40); color: #fff; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-brand { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand h4 { margin: 0; letter-spacing: 2px; }
        .sidebar-brand small { color: #adb5bd; }
        .sidebar-menu { list-style: none; padding: 10px 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: #adb5bd; text-decoration: none; transition: all 0.2s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(255,255,255,0.1); color: #fff; }
        .sidebar-menu li a.active { background: #0d6efd; color: #fff; }
        .sidebar-menu li a i { font-size: 1.2em; width: 24px; text-align: center; }
        .main-content { flex: 1; padding: 15px 10px; background: #f8f9fa; min-height: 100vh; }
        .footer { background: #212529; color: #fff; text-align: center; padding: 10px 0; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><h4>RESTAURANT</h4><small>Quản Lý Nhà Hàng</small></div>
        <ul class="sidebar-menu">
            <li><a href="/" {% if active_page == 'dashboard' %}class="active"{% endif %}><i class="bi bi-house-door"></i> Trang Chủ</a></li>
            <li><a href="/ban" {% if active_page == 'ban' %}class="active"{% endif %}><i class="bi bi-grid-3x3-gap"></i> Quản Lý Bàn</a></li>
            <li><a href="/monan" {% if active_page == 'monan' %}class="active"{% endif %}><i class="bi bi-cup-hot"></i> Món Ăn</a></li>
            <li><a href="/hoadon" {% if active_page == 'hoadon' %}class="active"{% endif %}><i class="bi bi-receipt"></i> Hóa Đơn</a></li>
            <li><a href="/nhanvien" {% if active_page == 'nhanvien' %}class="active"{% endif %}><i class="bi bi-people"></i> Nhân Viên</a></li>
        </ul>
    </aside>
    <div style="flex:1; margin-left:250px;">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer"><p class="m-0">Bản quyền &copy; Nhà Hàng 2026</p></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
