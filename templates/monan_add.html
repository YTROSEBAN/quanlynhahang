{% extends "base.html" %}
{% block title %}Thêm Món Ăn{% endblock %}

{% block content %}
<div class="page-header"><h2><i class="bi bi-plus-circle"></i> Thêm Món Ăn Mới</h2></div>
<form method="POST" action="/monan/add" enctype="multipart/form-data" style="max-width:650px" class="row g-3">
    <div class="col-12"><label class="form-label">Tên Món</label><input type="text" class="form-control" name="TenMon" required></div>
    <div class="col-md-4"><label class="form-label">Giá (VND)</label><input type="number" class="form-control" name="DonGia" required min="0"></div>
    <div class="col-md-4"><label class="form-label">Đơn Vị Tính</label><select class="form-select" name="DonViTinh"><option>Phần</option><option>Đĩa</option><option>Ly</option><option>Chai</option><option>Lon</option></select></div>
    <div class="col-md-4"><label class="form-label">Danh Mục</label><select class="form-select" name="MaDM">{% for dm in danhmuc %}<option value="{{ dm.id }}">{{ dm.ten_danhmuc }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Hình Ảnh</label><input type="file" class="form-control" name="Image" accept="image/*"></div>
    <div class="col-12"><label class="form-label">Mô Tả</label><textarea class="form-control" name="MoTa" rows="3"></textarea></div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Thêm Món</button>
        <a href="/monan" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Hủy</a>
    </div>
</form>
{% endblock %}
