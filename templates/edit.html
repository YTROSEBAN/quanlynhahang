<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa món</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/static/css/styles.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="/">Start Bootstrap</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Shop</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/menu/add">Thêm Menu</a></li>
                            <li><hr class="dropdown-divider" /></li>
                            <li><a class="dropdown-item" href="/menu/list">Danh sách Menu</a></li>
                            <li><a class="dropdown-item" href="/orders">Đơn hàng</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex">
                    <button class="btn btn-outline-dark" type="submit">
                        <i class="bi-cart-fill me-1"></i>
                        Cart
                        <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">Shop in style</h1>
                <p class="lead fw-normal text-white-50 mb-0">Sửa món</p>
            </div>
        </div>
    </header>

    <section class="py-5">
        <div class="container px-4 px-lg-5">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <form method="POST" action="/menu/edit/{{ item.ID }}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Tên món</label>
                            <input type="text" name="Name" class="form-control" value="{{ item.Name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá</label>
                            <input type="number" name="price" class="form-control" value="{{ item.Price }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Size</label>
                            <input type="number" name="Size" class="form-control" value="{{ item.Size }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Loại</label>
                            <input type="text" name="type" class="form-control" value="{{ item.Type }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hình ảnh hiện tại</label><br>
                            {% if item.Image %}
                            <img src="{{ item.Image }}" class="img-thumbnail" style="max-width:200px">
                            {% else %}
                            <span class="text-muted">Chưa có ảnh</span>
                            {% endif %}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Đổi hình ảnh (để trống nếu giữ nguyên)</label>
                            <input type="file" name="Image" class="form-control" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                        <a href="/menu/list" class="btn btn-secondary">Quay lại</a>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/scripts.js"></script>
</body>
</html>
