{% extends "base.html" %}
{% block title %}Cập Nhật Nhân Viên - Quản Lý Nhà Hàng{% endblock %}
{% block page_title %}Cập Nhật Thông Tin Nhân Sự{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header">
                <h5><i class="bi bi-pencil-square text-primary"></i> Chỉnh Sửa Nhân Viên: {{ item.HoTen }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/nhanvien/edit/{{ item.MaNV }}" class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Họ và Tên</label>
                        <input type="text" class="form-control" name="HoTen" value="{{ item.HoTen }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Giới Tính</label>
                        <select class="form-select" name="GioiTinh">
                            <option value="Nam" {% if item.GioiTinh=='Nam' or item.GioiTinh=='nam' %}selected{% endif %}>Nam</option>
                            <option value="Nữ" {% if item.GioiTinh=='Nữ' or item.GioiTinh=='Nu' or item.GioiTinh=='nu' %}selected{% endif %}>Nữ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số Điện Thoại</label>
                        <input type="text" class="form-control" name="SDT" value="{{ item.SDT or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="Email" value="{{ item.Email or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Chức Vụ</label>
                        <select class="form-select" name="ChucVu">
                            <option value="Quản lý" {% if item.ChucVu=='Quản lý' %}selected{% endif %}>Quản lý</option>
                            <option value="Phục vụ" {% if item.ChucVu=='Phục vụ' %}selected{% endif %}>Phục vụ</option>
                            <option value="Bếp" {% if item.ChucVu=='Bếp' %}selected{% endif %}>Bếp</option>
                            <option value="Thu ngân" {% if item.ChucVu=='Thu ngân' %}selected{% endif %}>Thu ngân</option>
                            <option value="Bảo vệ" {% if item.ChucVu=='Bảo vệ' %}selected{% endif %}>Bảo vệ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Trạng Thái Làm Việc</label>
                        <select class="form-select" name="TrangThai">
                            <option value="Dang lam" {% if item.TrangThai=='Dang lam' %}selected{% endif %}>Đang làm việc</option>
                            <option value="Nghi viec" {% if item.TrangThai!='Dang lam' %}selected{% endif %}>Đã nghỉ việc</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Địa Chỉ</label>
                        <input type="text" class="form-control" name="DiaChi" value="{{ item.DiaChi or '' }}">
                    </div>
                    <div class="col-12 pt-3 border-top d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg"></i> Lưu Thay Đổi
                        </button>
                        <a href="/nhanvien" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left"></i> Quay Lại
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
